name: build

# CI proves two things only: the tree builds without errors and the app
# launches without errors. The unit, UI, and protocol suites run locally
# on the dev box; release tests run manually on a clean system.
# (Operator decision 2026-09-17: narrowed from full test CI after
# repeated runner flakes. D00 T02 §7 evidence pipeline retired.)

on:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Cache provisioned SDK
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/dotnet-linux-x64
          key: sdk-v1-${{ runner.os }}-${{ hashFiles('global.json', 'tools/provision.sh') }}
          save-always: true
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-v1-${{ runner.os }}-
          save-always: true
      - name: Provision SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: ./tools/provision.sh
      - name: Build neutral scope
        run: |
          export DOTNET_ROOT="$PWD/.tools/dotnet-linux-x64"
          export PATH="$PWD/.tools/dotnet-linux-x64:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          dotnet build src/Notepad.Neutral.slnf --nologo

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Cache provisioned SDK
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/dotnet-win-x64
          key: sdk-v1-${{ runner.os }}-${{ hashFiles('global.json', 'tools/provision.ps1') }}
          save-always: true
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-v1-${{ runner.os }}-
          save-always: true
      - name: Provision SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: powershell -ExecutionPolicy Bypass -File tools\provision.ps1
      - name: Build solution
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          dotnet build src/ScratchPad.slnx --nologo
      - name: Install WindowsAppRuntime
        run: |
          Invoke-WebRequest -Uri https://aka.ms/windowsappsdk/2.4/2.4.0/windowsappruntimeinstall-x64.exe -OutFile $env:RUNNER_TEMP\WindowsAppRuntimeInstall.exe
          & $env:RUNNER_TEMP\WindowsAppRuntimeInstall.exe --quiet
          Get-AppxPackage -Name '*WindowsAppRuntime*' | Select-Object Name, Version
      # Launch smoke: the app must start and stay up with a clean exit path.
      # A GUI app never exits on its own, so an early exit is a crash (fail
      # loud); otherwise stop it after the soak and pass.
      - name: Launch smoke
        run: |
          $exe = "$PWD\Bin\ScratchPad\Debug\net10.0-windows10.0.19041.0\win-x64\ScratchPad.exe"
          $p = Start-Process $exe -PassThru
          $p.WaitForExit(30000)
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "ScratchPad exited during launch smoke with code $($p.ExitCode)" }
          if (-not $p.HasExited) { Stop-Process $p -Force }
      # Kept for manual clean-system testing: download and run, no SDK needed.
      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scratchpad-windows-x64
          path: Bin/ScratchPad/Debug/net10.0-windows10.0.19041.0/win-x64/
