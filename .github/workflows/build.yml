name: build

on:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Cache provisioned SDK
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/dotnet-linux-x64
          key: sdk-v1-${{ runner.os }}-${{ hashFiles('global.json', 'tools/provision.sh') }}
          save-always: true
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-v1-${{ runner.os }}-
          save-always: true
      - name: Provision SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: ./tools/provision.sh
      - name: Build neutral scope
        run: |
          export DOTNET_ROOT="$PWD/.tools/dotnet-linux-x64"
          export PATH="$PWD/.tools/dotnet-linux-x64:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          dotnet build src/Notepad.Neutral.slnf --nologo
      - name: Test neutral scope
        run: |
          export DOTNET_ROOT="$PWD/.tools/dotnet-linux-x64"
          export PATH="$PWD/.tools/dotnet-linux-x64:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          dotnet test src/Notepad.Neutral.slnf --nologo

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Cache provisioned SDK
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/dotnet-win-x64
          key: sdk-v1-${{ runner.os }}-${{ hashFiles('global.json', 'tools/provision.ps1') }}
          save-always: true
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-v1-${{ runner.os }}-
          save-always: true
      - name: Provision SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: powershell -ExecutionPolicy Bypass -File tools\provision.ps1
      - name: Build solution
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          dotnet build src/ScratchPad.slnx --nologo
      - name: Install WindowsAppRuntime
        run: |
          Invoke-WebRequest -Uri https://aka.ms/windowsappsdk/2.4/2.4.0/windowsappruntimeinstall-x64.exe -OutFile $env:RUNNER_TEMP\WindowsAppRuntimeInstall.exe
          & $env:RUNNER_TEMP\WindowsAppRuntimeInstall.exe --quiet
          Get-AppxPackage -Name '*WindowsAppRuntime*' | Select-Object Name, Version
      - name: Use dark app theme
        run: |
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name AppsUseLightTheme -Value 0
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name SystemUsesLightTheme -Value 0
      # D00 T02 §6: the Common Item Dialog honors Explorer's extension-hiding
      # in its File name box and file list. Runner profiles default to hiding
      # (HideFileExt 1) while dev boxes show (0); under hiding, 6 MenuBarTests
      # fail (prefills read without .txt, list items unfound, saves misrouted).
      - name: Show file extensions
        run: |
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name HideFileExt -Value 0
      - name: Test solution
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          dotnet test src/ScratchPad.slnx --nologo
      # D00 T02 §7: headless dev sessions cannot take pixel captures
      # (measured black frames), so green builds capture a canonical
      # evidence frame on the display-bearing runner. Default success()
      # condition: red builds skip this and upload golden failures below.
      # The UI suite drives the real profile (%LOCALAPPDATA%\ScratchPad),
      # so the profile is reset first: otherwise the frame restores the
      # suite's leftover session instead of a fresh launch. Orphaned app
      # processes are stopped (then waited on, best-effort) before the
      # reset so no live orphan's open handle can fail the delete; the
      # name match assumes an ephemeral GitHub-hosted runner, where no
      # operator-owned ScratchPad.exe can exist. WhatsNewSeen is seeded
      # so no first-run dialog covers the frame. The frame is asserted
      # canonical here -- 900x650 and non-black: a display-less runner
      # must fail loudly, not upload a black artifact on a green build.
      - name: Capture evidence frame
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          $appProfile = Join-Path ([Environment]::GetFolderPath("LocalApplicationData")) "ScratchPad"
          $orphans = Get-Process ScratchPad -ErrorAction SilentlyContinue
          if ($orphans) { $orphans | Stop-Process -Force -PassThru -ErrorAction SilentlyContinue | Wait-Process -Timeout 10 -ErrorAction SilentlyContinue }
          if (Test-Path $appProfile) { Remove-Item -Recurse -Force $appProfile }
          New-Item -ItemType Directory -Force -Path $appProfile | Out-Null
          '{"WhatsNewSeen":true}' | Set-Content -NoNewline (Join-Path $appProfile "settings.json")
          $exe = "$PWD\src\ScratchPad\bin\Debug\net10.0-windows10.0.19041.0\win-x64\ScratchPad.exe"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\evidence" | Out-Null
          dotnet run --project tools\CaptureBaseline -- stub "$exe" "$env:RUNNER_TEMP\evidence"
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::FromFile("$env:RUNNER_TEMP\evidence\stub-window.png")
          if ($bmp.Width -ne 900 -or $bmp.Height -ne 650) { throw "evidence frame is $($bmp.Width)x$($bmp.Height), expected 900x650" }
          $lit = 0
          for ($x = 0; $x -lt $bmp.Width; $x += 30) { for ($y = 0; $y -lt $bmp.Height; $y += 30) { $p = $bmp.GetPixel($x, $y); if ($p.R -gt 16 -or $p.G -gt 16 -or $p.B -gt 16) { $lit++ } } }
          $bmp.Dispose()
          if ($lit -eq 0) { throw "evidence frame is black: runner lost its display session" }
      - name: Upload evidence capture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-capture
          path: ${{ runner.temp }}/evidence/stub-window.png
      - name: Upload stub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scratchpad-stub-windows-x64
          path: src/ScratchPad/bin/Debug/net10.0-windows10.0.19041.0/win-x64/
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-windows-x64
          path: tests/UI/bin/Debug/net10.0-windows10.0.19041.0/golden-failure-*.png
          if-no-files-found: ignore
