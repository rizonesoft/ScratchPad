name: plan-gates

# Windows-only CI (operator decision 2026-09-19). Bash steps run under the
# runner's Git Bash; python3 is the image Python. Scope since 2026-10-18:
# the TODO graph's integrity, the plan projection, and the subagent routing
# pins (docs/specs/2026-10-18-simplify-process-design.md).

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'todo/**'
      - 'tools/githooks/**'
      - '.gitattributes'
      - '.github/workflows/plan.yml'
      - '.claude/agents/**'
      - '.claude/settings.json'
      - 'docs/agent-routing.md'

jobs:
  plan-gates:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Self-test the TODO graph tool
        run: python3 scripts/todo-graph.py self-test
      - name: Validate the TODO tree
        run: python3 scripts/todo-graph.py validate
      - name: Check subagent routing pins
        # Delegation cost rule (operator direction 2026-10-01): every repo
        # agent stays pinned to sonnet at high effort and the Agent
        # PreToolUse hook stays wired. Hermetic; no model call.
        run: |
          python3 scripts/agent_routing.py self-test
          python3 scripts/agent_routing.py check
      - name: Check plan projection is current
        run: python3 scripts/todo-graph.py plan --check
      - name: Assert commit hook is intact
        run: |
          test "$(git ls-files -s tools/githooks/pre-commit | cut -d' ' -f1)" = "100755" || { echo "hook index mode is not 100755"; exit 1; }
          git show HEAD:tools/githooks/pre-commit > /tmp/hook-blob || exit 1
          if grep -q $'\r' /tmp/hook-blob; then echo "hook blob carries CR"; exit 1; fi
          git check-attr eol -- tools/githooks/pre-commit | grep -q ': eol: lf$' || { echo "hook eol pin missing"; exit 1; }
