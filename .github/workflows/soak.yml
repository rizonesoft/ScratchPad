name: soak

# Nightly flake hunter. Full suite on both OSes plus repeats of the flake-prone
# suites (UI, Protocol). Procedure: docs/soak-and-quarantine.md.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  soak-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Provision SDK
        run: ./tools/provision.sh
      - name: Build neutral scope
        run: |
          export DOTNET_ROOT="$PWD/.tools/dotnet-linux-x64"
          export PATH="$PWD/.tools/dotnet-linux-x64:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          dotnet build src/Notepad.Neutral.slnf --nologo
      - name: Test neutral scope
        run: |
          export DOTNET_ROOT="$PWD/.tools/dotnet-linux-x64"
          export PATH="$PWD/.tools/dotnet-linux-x64:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          dotnet test src/Notepad.Neutral.slnf --nologo --logger "trx;LogFileName=soak-linux.trx" --results-directory TestResults
      - name: Repeat Protocol suite
        run: |
          export DOTNET_ROOT="$PWD/.tools/dotnet-linux-x64"
          export PATH="$PWD/.tools/dotnet-linux-x64:$PATH"
          export DOTNET_MULTILEVEL_LOOKUP=0
          for i in 1 2 3 4 5; do dotnet test tests/Protocol/Protocol.csproj --no-build --nologo --logger "trx;LogFileName=protocol-linux-$i.trx" --results-directory TestResults; done
      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-results-linux
          path: TestResults/

  soak-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Provision SDK
        run: powershell -ExecutionPolicy Bypass -File tools\provision.ps1
      - name: Build solution
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          dotnet build src/IntelligentNotepad.slnx --nologo
      - name: Install WindowsAppRuntime
        run: |
          Invoke-WebRequest -Uri https://aka.ms/windowsappsdk/2.4/2.4.0/windowsappruntimeinstall-x64.exe -OutFile $env:RUNNER_TEMP\WindowsAppRuntimeInstall.exe
          & $env:RUNNER_TEMP\WindowsAppRuntimeInstall.exe --quiet
          Get-AppxPackage -Name '*WindowsAppRuntime*' | Select-Object Name, Version
      - name: Use dark app theme
        run: |
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name AppsUseLightTheme -Value 0
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name SystemUsesLightTheme -Value 0
      - name: Test solution
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          dotnet test src/IntelligentNotepad.slnx --nologo --logger "trx;LogFileName=soak-windows.trx" --results-directory TestResults
      - name: Repeat UI suite
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          for ($i = 1; $i -le 5; $i++) { dotnet test tests/UI/UI.csproj --no-build --nologo --logger "trx;LogFileName=ui-windows-$i.trx" --results-directory TestResults; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Repeat Protocol suite
        run: |
          $env:DOTNET_ROOT = "$PWD\.tools\dotnet-win-x64"
          $env:PATH = "$PWD\.tools\dotnet-win-x64;" + $env:PATH
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          for ($i = 1; $i -le 5; $i++) { dotnet test tests/Protocol/Protocol.csproj --no-build --nologo --logger "trx;LogFileName=protocol-windows-$i.trx" --results-directory TestResults; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-results-windows
          path: TestResults/
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-soak
          path: tests/UI/bin/Debug/net10.0-windows10.0.19041.0/golden-failure-*.png
          if-no-files-found: ignore
