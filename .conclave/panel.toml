# Review-panel wiring: slot -> model, effort, timeout.
# Single source of truth for panel pins. `review_prompt.py run --slot`
# resolves producer argv from this file; the review skills name slots,
# never pins. Models and efforts are closed sets (see the schema note at
# PANEL_SLOTS in scripts/panel_slots.py): new producers arrive with probes
# plus review; `grok-latest` is the one alias, resolved at run time to
# the newest cached Grok (D00 T04 §25). Effort `inherit` does not exist:
# every slot states its effort concretely.

# The writer family never reviews (AGENTS.md: Claude Code is the only
# writer); the validator reads it here instead of naming it in code.
[panel]
writer = "claude"

[slot.bulk] # Full R1-R2, Light R1
model = "gpt-6-sol"
effort = "medium"
timeout = 600

[slot.signoff] # Full R3, Light R2: governs every stamp; GPT, independent of the Claude writer (D00 T04 §23)
model = "gpt-6-sol"
effort = "high"
timeout = 600

[slot.depth] # Full R4-R5, blocking findings only
model = "gpt-6-sol"
effort = "high"
timeout = 600

[slot.plan-primary] # plan review, independent of the Claude writer
model = "gpt-6-sol"
effort = "medium"
timeout = 900

[slot.arch-primary] # architecture gate
model = "gpt-6-sol"
effort = "high"
timeout = 600

[slot.fallback] # sol down in any role: newest Grok fills it + GPT outage note; both down, no stamp (D00 T04 §25)
model = "grok-latest"
effort = "high"
timeout = 900
