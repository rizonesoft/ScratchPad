# Review-panel wiring: slot -> model, effort, timeout.
# Single source of truth for panel pins. `review_prompt.py run --slot`
# resolves producer argv from this file; the review skills name slots,
# never pins. Models and efforts are closed sets (see the schema note at
# PANEL_SLOTS in scripts/panel_slots.py): new producers arrive with probes
# plus review. Effort `inherit` does not exist: every slot states its
# effort concretely, and same-family failovers repeat the slot effort by
# rule (see the outage-matrix prose in the review skills).

[slot.bulk] # Full R1-R2, Light R1
model = "gpt-6-sol"
effort = "medium"
timeout = 600

[slot.signoff] # Full R3, Light R2: governs every stamp; GPT, independent of the Claude writer (D00 T04 §23)
model = "gpt-6-sol"
effort = "high"
timeout = 600

[slot.depth] # Full R4-R5, blocking findings only; GPT like the sign-off
model = "gpt-6-sol"
effort = "high"
timeout = 600

[slot.bulk-fallback] # sol down: same family, silent, telemetry names terra
model = "gpt-5.6-terra"
effort = "medium"
timeout = 600

[slot.signoff-fallback] # sol down at sign-off or depth: same family, silent, telemetry names terra
model = "gpt-5.6-terra"
effort = "high"
timeout = 600

[slot.cross-fill] # both GPT down: opus fills any round, sign-off included, + GPT outage note
model = "claude-opus-5-5"
effort = "high"
timeout = 600

[slot.plan-primary] # plan review, independent of the Claude writer
model = "gpt-6-sol"
effort = "medium"
timeout = 900

[slot.plan-fallback] # plan fallback, same family as the writer: owes retry-owed
model = "claude-opus-5-5"
effort = "medium"
timeout = 900

[slot.arch-primary] # architecture gate, GPT like the sign-off
model = "gpt-6-sol"
effort = "high"
timeout = 600

[slot.arch-fallback] # sol gate down: terra attempt + Arch outage
model = "gpt-5.6-terra"
effort = "high"
timeout = 900
